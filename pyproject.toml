[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shannon-ai"
version = "0.1.0"
description = "AI-powered autonomous penetration testing and vulnerability assessment framework"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Shannon.ai Contributors"},
]
keywords = ["security", "penetration-testing", "vulnerability-assessment", "hacking", "cybersecurity"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Topic :: Security",
    "Topic :: System :: Networking",
]

dependencies = [
    "requests>=2.31.0",
    "aiohttp>=3.9.0",
    "httpx>=0.25.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "pydantic>=2.0.0",
    "cryptography>=41.0.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=4.9.0",
    "paramiko>=3.3.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "loguru>=0.7.0",
    "click>=8.1.0",
    "colorama>=0.4.6",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "black>=23.10.0",
    "flake8>=6.1.0",
    "mypy>=1.6.0",
]

ml = [
    "scikit-learn>=1.3.0",
    "tensorflow>=2.14.0",
    "torch>=2.0.0",
]

exploitation = [
    "pwntools>=4.9.0",
    "scapy>=2.5.0",
    "selenium>=4.14.0",
]

reporting = [
    "reportlab>=4.0.0",
    "jinja2>=3.1.0",
    "plotly>=5.17.0",
]

[project.urls]
Homepage = "https://github.com/andyhlocs-png/shannon.ai"
Documentation = "https://github.com/andyhlocs-png/shannon.ai/docs"
Repository = "https://github.com/andyhlocs-png/shannon.ai.git"
"Issue Tracker" = "https://github.com/andyhlocs-png/shannon.ai/issues"

[project.scripts]
shannon = "shannon.cli:cli"

[tool.black]
line-length = 100
target-version = ['py39']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_mode = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
line_length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --strict-markers"
markers = [
    "unit: unit tests",
    "integration: integration tests",
    "slow: slow tests",
]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.coverage.run]
source = ["shannon"]
omit = [
    "*/tests/*",
    "*/venv/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
